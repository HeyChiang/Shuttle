name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets to'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-amd64
          - os: ubuntu-latest
            asset: linux-amd64
          - os: macos-15
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-amd64
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build
        shell: bash
        run: wails3 build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path bin/shuttle.exe -DestinationPath "shuttle-${{ steps.tag.outputs.tag }}-${{ matrix.asset }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: zip -j "shuttle-${{ steps.tag.outputs.tag }}-${{ matrix.asset }}.zip" bin/shuttle

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wails3 task darwin:package
          ditto -c -k --sequesterRsrc --keepParent "bin/shuttle.app" "shuttle-${{ steps.tag.outputs.tag }}-${{ matrix.asset }}.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" "shuttle-$TAG-${{ matrix.asset }}.zip" --clobber
